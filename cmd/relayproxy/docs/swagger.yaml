basePath: /
definitions:
  controller.FlagChangeResponse:
    properties:
      flags:
        additionalProperties:
          format: int32
          type: integer
        type: object
      hash:
        type: integer
    type: object
  controller.FlagConfigurationRequest:
    properties:
      flags:
        items:
          type: string
        type: array
    type: object
  controller.FlagConfigurationResponse:
    properties:
      errorCode:
        type: string
      errorDetails:
        type: string
      evaluationContextEnrichment:
        additionalProperties: {}
        type: object
      flags:
        additionalProperties:
          $ref: '#/definitions/flag.Flag'
        type: object
    type: object
  controller.retrieverRefreshResponse:
    properties:
      refreshed:
        type: boolean
    type: object
  dto.DTO:
    properties:
      bucketingKey:
        description: BucketingKey defines a source for a dynamic targeting key
        type: string
      converter:
        description: |-
          Converter (optional) is the name of converter to use, if no converter specified we try to determine
          which converter to use based on the fields we receive for the flag
        type: string
      defaultRule:
        allOf:
        - $ref: '#/definitions/flag.Rule'
        description: |-
          DefaultRule is the rule applied after checking that any other rules
          matched the user.
      disable:
        description: Disable is true if the flag is disabled.
        type: boolean
      experimentation:
        allOf:
        - $ref: '#/definitions/dto.ExperimentationDto'
        description: |-
          Experimentation is your struct to configure an experimentation.
          It will allow you to configure a start date and an end date for your flag.
          When the experimentation is not running, the flag will serve the default value.
      metadata:
        additionalProperties: {}
        description: Metadata is a field containing information about your flag such
          as an issue tracker link, a description, etc ...
        type: object
      scheduledRollout:
        description: |-
          Scheduled is your struct to configure an update on some fields of your flag over time.
          You can add several steps that updates the flag, this is typically used if you want to gradually add more user
          in your flag.
        items:
          $ref: '#/definitions/flag.ScheduledStep'
        type: array
      targeting:
        description: |-
          Rules is the list of Rule for this flag.
          This an optional field.
        items:
          $ref: '#/definitions/flag.Rule'
        type: array
      trackEvents:
        description: |-
          TrackEvents is false if you don't want to export the data in your data exporter.
          Default value is true
        type: boolean
      variations:
        additionalProperties: {}
        description: |-
          Variations are all the variations available for this flag. The minimum is 2 variations and, we don't have any max
          limit except if the variationValue is a bool, the max is 2.
        type: object
      version:
        description: |-
          Version (optional) This field contains the version of the flag.
          The version is manually managed when you configure your flags and, it is used to display the information
          in the notifications and data collection.
        type: string
    type: object
  dto.ExperimentationDto:
    properties:
      end:
        description: End is the ending time of the experimentation
        type: string
      start:
        description: Start is the starting time of the experimentation
        type: string
    type: object
  exporter.FeatureEventMetadata:
    additionalProperties: {}
    type: object
  flag.ErrorCode:
    enum:
    - PROVIDER_NOT_READY
    - FLAG_NOT_FOUND
    - PARSE_ERROR
    - TYPE_MISMATCH
    - GENERAL
    - INVALID_CONTEXT
    - TARGETING_KEY_MISSING
    - FLAG_CONFIG
    type: string
    x-enum-varnames:
    - ErrorCodeProviderNotReady
    - ErrorCodeFlagNotFound
    - ErrorCodeParseError
    - ErrorCodeTypeMismatch
    - ErrorCodeGeneral
    - ErrorCodeInvalidContext
    - ErrorCodeTargetingKeyMissing
    - ErrorFlagConfiguration
  flag.ExperimentationRollout:
    properties:
      end:
        description: End is the ending time of the experimentation
        type: string
      start:
        description: Start is the starting time of the experimentation
        type: string
    type: object
  flag.Flag:
    properties:
      defValue:
        description: default value (as text); for usage message
        type: string
      name:
        description: name as it appears on command line
        type: string
      usage:
        description: help message
        type: string
      value:
        description: value as set
    type: object
  flag.ProgressiveRollout:
    properties:
      end:
        allOf:
        - $ref: '#/definitions/flag.ProgressiveRolloutStep'
        description: End contains what describes the end status of the rollout.
      initial:
        allOf:
        - $ref: '#/definitions/flag.ProgressiveRolloutStep'
        description: Initial contains a description of the initial state of the rollout.
    type: object
  flag.ProgressiveRolloutStep:
    properties:
      date:
        description: Date is the time it starts or ends.
        type: string
      percentage:
        description: Percentage is the percentage (initial or end) for the progressive
          rollout
        type: number
      variation:
        description: Variation - name of the variation for this step
        type: string
    type: object
  flag.Rule:
    properties:
      disable:
        description: Disable indicates that this rule is disabled.
        type: boolean
      name:
        description: |-
          Name is the name of the rule, this field is mandatory if you want
          to update the rule during scheduled rollout
        type: string
      percentage:
        additionalProperties:
          format: float64
          type: number
        description: |-
          Percentages represents the percentage we should give to each variation.
          example: variationA = 10%, variationB = 80%, variationC = 10%
        type: object
      progressiveRollout:
        allOf:
        - $ref: '#/definitions/flag.ProgressiveRollout'
        description: |-
          ProgressiveRollout is your struct to configure a progressive rollout deployment of your flag.
          It will allow you to ramp up the percentage of your flag over time.
          You can decide at which percentage you starts with and at what percentage you ends with in your release ramp.
          Before the start date we will serve the initial percentage and, after we will serve the end percentage.
      query:
        description: Query represents the query used to target the audience of the
          flag.
        type: string
      variation:
        description: |-
          VariationResult represents the variation name to use if the rule apply for the user.
          In case we have a percentage field in the config VariationResult is ignored
        type: string
    type: object
  flag.ScheduledStep:
    properties:
      bucketingKey:
        description: BucketingKey defines a source for a dynamic targeting key
        type: string
      date:
        type: string
      defaultRule:
        allOf:
        - $ref: '#/definitions/flag.Rule'
        description: |-
          DefaultRule is the originalRule applied after checking that any other rules
          matched the user.
      disable:
        description: Disable is true if the flag is disabled.
        type: boolean
      experimentation:
        allOf:
        - $ref: '#/definitions/flag.ExperimentationRollout'
        description: |-
          Experimentation is your struct to configure an experimentation, it will allow you to configure a start date and
          an end date for your flag.
          When the experimentation is not running, the flag will serve the default value.
      metadata:
        additionalProperties: {}
        description: Metadata is a field containing information about your flag such
          as an issue tracker link, a description, etc ...
        type: object
      scheduledRollout:
        description: |-
          Scheduled is your struct to configure an update on some fields of your flag over time.
          You can add several steps that updates the flag, this is typically used if you want to gradually add more user
          in your flag.
        items:
          $ref: '#/definitions/flag.ScheduledStep'
        type: array
      targeting:
        description: |-
          Rules is the list of Rule for this flag.
          This an optional field.
        items:
          $ref: '#/definitions/flag.Rule'
        type: array
      trackEvents:
        description: |-
          TrackEvents is false if you don't want to export the data in your data exporter.
          Default value is true
        type: boolean
      variations:
        additionalProperties: {}
        description: Variations are all the variations available for this flag. You
          can have as many variation as needed.
        type: object
      version:
        description: |-
          Version (optional) This field contains the version of the flag.
          The version is manually managed when you configure your flags, and it is used to display the information
          in the notifications and data collection.
        type: string
    type: object
  github_com_thomaspoignant_go-feature-flag_cmd_relayproxy_model.FlagType:
    enum:
    - boolean
    - string
    - integer
    - float
    - object
    type: string
    x-enum-varnames:
    - FlagTypeBoolean
    - FlagTypeString
    - FlagTypeInteger
    - FlagTypeFloat
    - FlagTypeObject
  github_com_thomaspoignant_go-feature-flag_cmdhelpers_manifest_model.FlagType:
    enum:
    - boolean
    - string
    - integer
    - float
    - object
    type: string
    x-enum-varnames:
    - FlagTypeBoolean
    - FlagTypeString
    - FlagTypeInteger
    - FlagTypeFloat
    - FlagTypeObject
  model.AllFlagRequest:
    properties:
      evaluationContext:
        allOf:
        - $ref: '#/definitions/model.EvaluationContextRequest'
        description: EvaluationContext The representation of a EvaluationContext for
          your feature flag system.
    type: object
  model.CollectEvalDataRequest:
    properties:
      events:
        description: |-
          Events is the list of the event we send in the payload
          here the type is any because we will unmarshal later in the different event types
        items:
          additionalProperties: {}
          type: object
        type: array
      meta:
        allOf:
        - $ref: '#/definitions/exporter.FeatureEventMetadata'
        description: Meta are the extra information added during the configuration
    type: object
  model.CollectEvalDataResponse:
    properties:
      ingestedContentCount:
        description: IngestedContentCount number of model.FeatureEvents that have
          been sent to the data exporter
        type: integer
    type: object
  model.CreateFlagRequest:
    properties:
      definition:
        $ref: '#/definitions/dto.DTO'
      key:
        type: string
    type: object
  model.ErrorResponse:
    properties:
      errorCode:
        $ref: '#/definitions/flag.ErrorCode'
      errorDetails:
        type: string
    type: object
  model.EvalFlagRequest:
    properties:
      defaultValue:
        description: The value will we use if we are not able to get the variation
          of the flag.
      evaluationContext:
        allOf:
        - $ref: '#/definitions/model.EvaluationContextRequest'
        description: EvaluationContext The representation of a EvaluationContext for
          your feature flag system.
    type: object
  model.EvaluationContextRequest:
    properties:
      custom:
        additionalProperties:
          type: string
        description: Custom is a map containing all extra information for this user.
        example:
          company: GO Feature Flag
          email: contact@gofeatureflag.org
          firstname: John
          lastname: Doe
        type: object
      key:
        description: Key is the identifier of the UserRequest.
        example: 08b5ffb7-7109-42f4-a6f2-b85560fbd20f
        type: string
    type: object
  model.FlagListMeta:
    properties:
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  model.FlagListResponse:
    properties:
      flags:
        items:
          $ref: '#/definitions/model.FlagResponse'
        type: array
      meta:
        $ref: '#/definitions/model.FlagListMeta'
    type: object
  model.FlagResponse:
    properties:
      definition:
        $ref: '#/definitions/dto.DTO'
      editable:
        description: Editable is false when the owning retriever/flagset doesn't support
          writes.
        type: boolean
      etag:
        description: ETag is the current revision; echo it back as If-Match on the
          next write.
        type: string
      key:
        type: string
      source:
        description: Source is the retriever owning this flag, e.g. "postgresql:go_feature_flag".
        type: string
      type:
        $ref: '#/definitions/github_com_thomaspoignant_go-feature-flag_cmd_relayproxy_model.FlagType'
    type: object
  model.HealthResponse:
    properties:
      initialized:
        description: Set to true if the HTTP server is started
        example: true
        type: boolean
    type: object
  model.InfoResponse:
    properties:
      cacheRefresh:
        description: |-
          LatestCacheRefresh is the last time when your flag file was read and stored in the internal cache.
          This field is used for backward compatibility when using the default flagset.
        example: "2022-06-13T11:22:55.941628+02:00"
        type: string
      flagsets:
        additionalProperties:
          type: string
        description: |-
          Flagsets contains the cache refresh dates for each flagset when using multiple flagsets.
          The format is {"flagset name": "2022-06-13T11:22:55.941628+02:00"}
        example:
          default: "2022-06-13T11:22:55.941628+02:00"
          feature-flags: "2022-06-13T11:22:55.941628+02:00"
        type: object
    type: object
  model.ManifestDefinitionSuccessResponse:
    properties:
      defaultValue: {}
      description:
        type: string
      key:
        type: string
      type:
        $ref: '#/definitions/github_com_thomaspoignant_go-feature-flag_cmdhelpers_manifest_model.FlagType'
    type: object
  model.ManifestError:
    properties:
      error:
        $ref: '#/definitions/model.ManifestErrorDetails'
    type: object
  model.ManifestErrorDetails:
    properties:
      message:
        example: Authorization header required
        type: string
      status:
        example: 401
        type: integer
    type: object
  model.ManifestSuccessResponse:
    properties:
      flags:
        items:
          $ref: '#/definitions/model.ManifestDefinitionSuccessResponse'
        type: array
    type: object
  model.OFREPBulkEvaluateSuccessResponse:
    properties:
      flags:
        items:
          $ref: '#/definitions/model.OFREPFlagBulkEvaluateSuccessResponse'
        type: array
    type: object
  model.OFREPCommonResponseError:
    properties:
      errorCode:
        $ref: '#/definitions/flag.ErrorCode'
      errorDetails:
        type: string
    type: object
  model.OFREPEvalFlagRequest:
    properties:
      context:
        additionalProperties:
          type: string
        example:
          company: GO Feature Flag
          firstname: John
          lastname: Doe
          targetingKey: 4f433951-4c8c-42b3-9f18-8c9a5ed8e9eb
        type: object
    type: object
  model.OFREPEvaluateResponseError:
    properties:
      errorCode:
        $ref: '#/definitions/flag.ErrorCode'
      errorDetails:
        type: string
      key:
        type: string
    type: object
  model.OFREPEvaluateSuccessResponse:
    properties:
      key:
        type: string
      metadata:
        additionalProperties: {}
        type: object
      reason:
        type: string
      value: {}
      variant:
        type: string
    type: object
  model.OFREPFlagBulkEvaluateSuccessResponse:
    properties:
      errorCode:
        type: string
      errorDetails:
        type: string
      key:
        type: string
      metadata:
        additionalProperties: {}
        type: object
      reason:
        type: string
      value: {}
      variant:
        type: string
    type: object
  model.SetFlagStateRequest:
    properties:
      disable:
        type: boolean
    type: object
  modeldocs.AllFlags:
    description: AllFlags contains the full list of all the flags available for the
      user
    properties:
      flags:
        additionalProperties:
          $ref: '#/definitions/modeldocs.FlagState'
        description: flags is the list of flag for the user.
        type: object
      valid:
        description: '`true` if something went wrong in the relay proxy (flag does
          not exists, ...) and we serve the defaultValue.'
        example: false
        type: boolean
    type: object
  modeldocs.EvalFlagDoc:
    properties:
      errorCode:
        description: Code of the error returned by the server.
        example: ""
        type: string
      failed:
        description: '`true` if something went wrong in the relay proxy (flag does
          not exists, ...) and we serve the defaultValue.'
        example: false
        type: boolean
      metadata:
        additionalProperties: {}
        description: Metadata is a field containing information about your flag such
          as an issue tracker link, a description, etc ...
        type: object
      reason:
        description: reason why we have returned this value.
        example: TARGETING_MATCH
        type: string
      trackEvents:
        description: '`true` if the event was tracked by the relay proxy.'
        example: true
        type: boolean
      value:
        description: The flag value for this user.
      variationType:
        description: The variation used to give you this value.
        example: variation-A
        type: string
      version:
        description: The version of the flag used.
        example: "1.0"
        type: string
    type: object
  modeldocs.FlagState:
    properties:
      timestamp:
        description: Timestamp is the time when the flag was evaluated.
        example: 1652113076
        type: integer
      trackEvents:
        description: TrackEvents this flag is trackable.
        example: false
        type: boolean
      value:
        description: Value is the flag value, it can be any JSON types.
      variationType:
        description: VariationType is the name of the variation used to have the flag
          value.
        example: variation-A
        type: string
    type: object
  modeldocs.HTTPErrorDoc:
    properties:
      message:
        description: Message of your error
        example: An error occurred
        type: string
    type: object
  notifier.DiffCache:
    properties:
      added:
        additionalProperties:
          $ref: '#/definitions/flag.Flag'
        type: object
      deleted:
        additionalProperties:
          $ref: '#/definitions/flag.Flag'
        type: object
      updated:
        additionalProperties:
          $ref: '#/definitions/notifier.DiffUpdated'
        type: object
    type: object
  notifier.DiffUpdated:
    properties:
      new_value:
        $ref: '#/definitions/flag.Flag'
      old_value:
        $ref: '#/definitions/flag.Flag'
    type: object
info:
  contact:
    email: contact@gofeatureflag.org
    name: GO feature flag relay proxy
    url: https://gofeatureflag.org
  description: "# Introduction\r\n\r\nThis API is documented in **OpenAPI format**
    and describe the REST API of the **GO Feature Flag relay proxy**.\r\n\r\nThe relay
    proxy is a component to evaluate your feature flags remotely when using **GO Feature
    Flag**.  \r\nThis API is mostly used by all the OpenFeature providers."
  license:
    name: MIT
    url: https://github.com/thomaspoignant/go-feature-flag/blob/main/LICENSE
  title: GO Feature Flag relay proxy endpoints
  x-logo:
    url: https://raw.githubusercontent.com/thomaspoignant/go-feature-flag/main/logo_128.png
paths:
  /admin/v1/retriever/refresh:
    post:
      description: |-
        This endpoint is used to force the refresh of the flags in the cache.
        This endpoint is used when you know explicitly that a flag has changed, and you want to trigger
        the collection of the new versions.
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/controller.retrieverRefreshResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/modeldocs.HTTPErrorDoc'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/modeldocs.HTTPErrorDoc'
      security:
      - ApiKeyAuth: []
      summary: This endpoint is used to force the refresh of the flags in the cache.
      tags:
      - Admin API to manage GO Feature Flag
  /debug/pprof/:
    get:
      description: |-
        This endpoint is provided by the echo pprof middleware.
        To know more please check this blogpost from the GO team https://go.dev/blog/pprof.
        Visit the page /debug/pprof/ to see the available endpoints, all endpoint are not in the swagger documentation because they are standard pprof endpoints.
        This endpoint is only available in debug mode.
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: pprof endpoint
      tags:
      - Profiling
  /health:
    get:
      description: |-
        Making a **GET** request to the URL path `/health` will tell you if the relay proxy is ready to serve
        traffic.

        This is useful especially for loadbalancer to know that they can send traffic to the service.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.HealthResponse'
      summary: Health
      tags:
      - Monitoring
  /info:
    get:
      description: |-
        Making a **GET** request to the URL path `/info` will give you information about the actual state
        of the relay proxy.

        As of Today the level of information is small be we can improve this endpoint to returns more
        information.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.InfoResponse'
      summary: Info
      tags:
      - Monitoring
  /metrics:
    get:
      description: This endpoint is providing metrics about the relay proxy in the
        prometheus format.
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Prometheus endpoint
      tags:
      - Monitoring
  /ofrep/v1/evaluate/flags:
    post:
      consumes:
      - application/json
      description: |-
        Making a **POST** request to the URL `/ofrep/v1/evaluate/flags` will give you the value of the list
        of feature flags for this evaluation context.

        If no flags are provided, the API will evaluate all available flags in the configuration.
      parameters:
      - description: The request will be processed only if ETag doesn't match.
        in: header
        name: If-None-Match
        type: string
      - description: Evaluation Context and list of flag for this API call
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/model.OFREPEvalFlagRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OFREP successful evaluation response
          schema:
            $ref: '#/definitions/model.OFREPBulkEvaluateSuccessResponse'
        "304":
          description: 'Etag: \"117-0193435c612c50d93b798619d9464856263dbf9f\'
          schema:
            type: string
        "400":
          description: Bad evaluation request
          schema:
            $ref: '#/definitions/model.OFREPCommonResponseError'
        "401":
          description: Unauthorized - You need credentials to access the API
          schema:
            $ref: '#/definitions/modeldocs.HTTPErrorDoc'
        "403":
          description: Forbidden - You are not authorized to access the API
          schema:
            $ref: '#/definitions/modeldocs.HTTPErrorDoc'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/modeldocs.HTTPErrorDoc'
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Open-Feature Remote Evaluation Protocol bulk evaluation API.
      tags:
      - OpenFeature Remote Evaluation Protocol (OFREP)
  /ofrep/v1/evaluate/flags/{flag_key}:
    post:
      consumes:
      - application/json
      description: |
        Making a **POST** request to the URL `/ofrep/v1/evaluate/flags/{your_flag_name}` will give you the
        value of the flag for this evaluation context
      parameters:
      - description: Evaluation Context for this API call
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/model.OFREPEvalFlagRequest'
      - description: Name of your feature flag
        in: path
        name: flag_key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/model.OFREPEvaluateSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.OFREPEvaluateResponseError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/modeldocs.HTTPErrorDoc'
        "404":
          description: Flag Not Found
          schema:
            $ref: '#/definitions/model.OFREPEvaluateResponseError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/modeldocs.HTTPErrorDoc'
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Evaluate a feature flag using the OpenFeature Remote Evaluation Protocol
      tags:
      - OpenFeature Remote Evaluation Protocol (OFREP)
  /openfeature/v0/manifest:
    get:
      consumes:
      - application/json
      description: |-
        **GET** request to the URL `/openfeature/v0/manifest` returns the project manifest
        containing active flags. Archived flags are excluded.
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/model.ManifestSuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ManifestError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ManifestError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/model.ManifestError'
      security:
      - ApiKeyAuth: []
      summary: GetManifest is a GET endpoint to return the flags configured in GO
        Feature Flag.
      tags:
      - OpenFeature Manisfest API
  /stream/v1/sse/flag/change:
    get:
      description: |-
        Server-Sent Events endpoint pushing flag change notifications.
        Each event payload is a `notifier.DiffCache` JSON document.
        The full URL (including query string) is sensitive and must not be logged
        or persisted by intermediaries.
      parameters:
      - description: apiKey to authorize the connection to the relay proxy
        in: query
        name: apiKey
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE stream of flag change events
          schema:
            $ref: '#/definitions/notifier.DiffCache'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/modeldocs.HTTPErrorDoc'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/modeldocs.HTTPErrorDoc'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/modeldocs.HTTPErrorDoc'
      summary: SSE endpoint to be notified about flag changes
      tags:
      - GO Feature Flag Evaluation Stream API
  /stream/v1/ws/flag/change:
    get:
      consumes:
      - application/json
      description: |-
        This endpoint is a websocket endpoint to be notified about flag changes;
        every change pushes a notifier.DiffCache message to the client.
      parameters:
      - description: apiKey to authorize the connection to the relay proxy
        in: query
        name: apiKey
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/notifier.DiffCache'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/modeldocs.HTTPErrorDoc'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/modeldocs.HTTPErrorDoc'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/modeldocs.HTTPErrorDoc'
      summary: Websocket endpoint to be notified about flag changes
      tags:
      - GO Feature Flag Evaluation Stream API
  /v1/allflags:
    post:
      consumes:
      - application/json
      description: |-
        Making a **POST** request to the URL `/v1/allflags` will give you the values of all the flags for
        this user.

        To get a variation you should provide information about the user.
        For that you should provide some user information in JSON in the request body.
      parameters:
      - description: Payload of the user we want to challenge against the flag.
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/model.AllFlagRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/modeldocs.AllFlags'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/modeldocs.HTTPErrorDoc'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/modeldocs.HTTPErrorDoc'
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: All flags variations for a user
      tags:
      - GO Feature Flag Evaluation API
  /v1/data/collector:
    post:
      consumes:
      - application/json
      description: |-
        This endpoint is receiving the events of your flags usage to send them in the data collector.

        It is used by the different Open Feature providers to send in bulk all the cached events to avoid
        to lose track of what happen when a cached flag is used.
      parameters:
      - description: List of flag evaluation that be passed to the data exporter
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/model.CollectEvalDataRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/model.CollectEvalDataResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/modeldocs.HTTPErrorDoc'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/modeldocs.HTTPErrorDoc'
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Endpoint to send usage of your flags to be collected
      tags:
      - GO Feature Flag Evaluation API
  /v1/feature/{flag_key}/eval:
    post:
      consumes:
      - application/json
      description: |-
        Making a **POST** request to the URL `/v1/feature/<your_flag_name>/eval` will give you the value of the
        flag for this user.

        To get a variation you should provide information about the user:
        - User information in JSON in the request body.
        - A default value in case there is an error while evaluating the flag.

        Note that you will always have a usable value in the response, you can use the field `failed` to know if
        an issue has occurred during the validation of the flag, in that case the value returned will be the
        default value.
      parameters:
      - description: Payload of the user we want to get all the flags from.
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/model.EvalFlagRequest'
      - description: Name of your feature flag
        in: path
        name: flag_key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/modeldocs.EvalFlagDoc'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/modeldocs.HTTPErrorDoc'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/modeldocs.HTTPErrorDoc'
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Evaluate a feature flag
      tags:
      - GO Feature Flag Evaluation API
  /v1/flag/change:
    get:
      consumes:
      - application/json
      description: |-
        Making a **GET** request to the URL `/v1/flag/change` will give you the hash of the current
        configuration, you can use this hash to know if the configuration has changed.
      parameters:
      - description: The request will be processed only if ETag doesn't match.
        in: header
        name: If-None-Match
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/controller.FlagChangeResponse'
        "304":
          description: 'Etag: \"117-0193435c612c50d93b798619d9464856263dbf9f\'
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/modeldocs.HTTPErrorDoc'
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Endpoint to poll if you want to know if there is a configuration change
        in the flags
      tags:
      - GO Feature Flag Evaluation API
  /v1/flag/configuration:
    post:
      consumes:
      - application/json
      description: |-
        Making a **POST** request to the URL `/v1/flag/configuration` will give you the list of
        the flags to use them for local evaluation in your provider.
      parameters:
      - description: List of flags to get the configuration from.
        in: body
        name: data
        schema:
          $ref: '#/definitions/controller.FlagConfigurationRequest'
      - description: The request will be processed only if ETag doesn't match.
        in: header
        name: If-None-Match
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/controller.FlagConfigurationResponse'
        "304":
          description: 'Etag: \"117-0193435c612c50d93b798619d9464856263dbf9f\'
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/modeldocs.HTTPErrorDoc'
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Endpoint to poll if you want to get the configuration of the flags.
      tags:
      - GO Feature Flag Evaluation API
  /v1/flags:
    get:
      description: Returns every flag definition known to the relay proxy for the
        caller's flagset.
      parameters:
      - description: Pagination offset
        in: query
        name: offset
        type: integer
      - description: Pagination limit (max 500)
        in: query
        name: limit
        type: integer
      - description: Filter by flag type
        in: query
        name: type
        type: string
      - description: Case-insensitive substring match on flag key
        in: query
        name: q
        type: string
      - description: Filter by disabled state
        in: query
        name: disabled
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/model.FlagListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: List feature flags
      tags:
      - Flag Management API
    post:
      consumes:
      - application/json
      description: |-
        Only available when the caller's flagset is backed by exactly one writable
        (PostgreSQL) retriever with an explicit flagset configured.
      parameters:
      - description: The flag to create
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/model.CreateFlagRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.FlagResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Create a feature flag
      tags:
      - Flag Management API
  /v1/flags/{flag_key}:
    delete:
      parameters:
      - description: The flag key
        in: path
        name: flag_key
        required: true
        type: string
      - description: Optimistic-concurrency guard
        in: header
        name: If-Match
        type: string
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "412":
          description: Precondition Failed
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Delete a feature flag
      tags:
      - Flag Management API
    get:
      parameters:
      - description: The flag key
        in: path
        name: flag_key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/model.FlagResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get a feature flag
      tags:
      - Flag Management API
    patch:
      consumes:
      - application/merge-patch+json
      description: |-
        RFC 7386 merge-patch of the flag definition. Only the fields present in the
        body are changed; a JSON null deletes a field.
      parameters:
      - description: The flag key
        in: path
        name: flag_key
        required: true
        type: string
      - description: Optimistic-concurrency guard
        in: header
        name: If-Match
        type: string
      - description: Merge-patch document
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/dto.DTO'
      produces:
      - application/json
      responses:
        "200":
          description: Updated
          schema:
            $ref: '#/definitions/model.FlagResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "412":
          description: Precondition Failed
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Update parts of a feature flag
      tags:
      - Flag Management API
    put:
      consumes:
      - application/json
      description: |-
        Full replacement of the flag definition. Creates the flag (upsert) if it
        does not exist yet.
      parameters:
      - description: The flag key
        in: path
        name: flag_key
        required: true
        type: string
      - description: Optimistic-concurrency guard
        in: header
        name: If-Match
        type: string
      - description: The full flag definition
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/dto.DTO'
      produces:
      - application/json
      responses:
        "200":
          description: Replaced
          schema:
            $ref: '#/definitions/model.FlagResponse'
        "201":
          description: Created via upsert
          schema:
            $ref: '#/definitions/model.FlagResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "412":
          description: Precondition Failed
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Replace a feature flag
      tags:
      - Flag Management API
  /v1/flags/{flag_key}/state:
    patch:
      consumes:
      - application/json
      description: |-
        Convenience endpoint that sets the disable field without touching the rest
        of the flag definition.
      parameters:
      - description: The flag key
        in: path
        name: flag_key
        required: true
        type: string
      - description: Optimistic-concurrency guard
        in: header
        name: If-Match
        type: string
      - description: The new state
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/model.SetFlagStateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: State changed
          schema:
            $ref: '#/definitions/model.FlagResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "412":
          description: Precondition Failed
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Enable or disable a flag
      tags:
      - Flag Management API
  /ws/v1/flag/change:
    get:
      consumes:
      - application/json
      deprecated: true
      description: |-
        Deprecated: use /stream/v1/ws/flag/change instead. This endpoint
        is a websocket endpoint to be notified about flag changes; every
        change pushes a notifier.DiffCache message to the client.
      parameters:
      - description: apiKey to authorize the connection to the relay proxy
        in: query
        name: apiKey
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/notifier.DiffCache'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/modeldocs.HTTPErrorDoc'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/modeldocs.HTTPErrorDoc'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/modeldocs.HTTPErrorDoc'
      summary: Websocket endpoint to be notified about flag changes
      tags:
      - GO Feature Flag Evaluation Stream API
securityDefinitions:
  ApiKeyAuth:
    description: Use configured APIKeys in yaml config as authorization keys, disabled
      when this yaml config is not set.
    in: header
    name: Authorization
    type: apiKey
  XApiKeyAuth:
    description: |-
      Use configured APIKeys in yaml config as authorization keys via X-API-Key header,
      disabled when this yaml config is not set.
    in: header
    name: X-API-Key
    type: apiKey
swagger: "2.0"
