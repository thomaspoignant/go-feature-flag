suite: test pod disruption budget
templates:
  - pdb.yaml
  - deployment.yaml
  - configmap.yaml
tests:
  - it: should not create PDB when pdb.enable is false
    template: pdb.yaml
    set:
      pdb.enable: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should create PDB when pdb.enable is true
    template: pdb.yaml
    set:
      pdb.enable: true
      pdb.minAvailable: 1
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: apiVersion
          value: policy/v1

  - it: should set correct metadata name
    template: pdb.yaml
    set:
      pdb.enable: true
      pdb.minAvailable: 1
      fullnameOverride: my-relay-proxy
    asserts:
      - equal:
          path: metadata.name
          value: my-relay-proxy

  - it: should set minAvailable when specified
    template: pdb.yaml
    set:
      pdb.enable: true
      pdb.minAvailable: 2
    asserts:
      - equal:
          path: spec.minAvailable
          value: 2
      - isNull:
          path: spec.maxUnavailable

  - it: should default minAvailable to 1 if set but no value given
    template: pdb.yaml
    set:
      pdb.enable: true
    asserts:
      - equal:
          path: spec.minAvailable
          value: 1

  - it: should set maxUnavailable when minAvailable is not set
    template: pdb.yaml
    set:
      pdb.enable: true
      pdb.maxUnavailable: 1
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 1
      - isNull:
          path: spec.minAvailable

  - it: should set maxUnavailable when both are specified
    template: pdb.yaml
    set:
      pdb.enable: true
      pdb.minAvailable: 2
      pdb.maxUnavailable: 1
    asserts:
      - isNull:
          path: spec.minAvailable
      - equal:
          path: spec.maxUnavailable
          value: 1

  - it: should select pods with the chart selector labels
    template: pdb.yaml
    release:
      name: my-release
    set:
      pdb.enable: true
      pdb.minAvailable: 1
      fullnameOverride: my-relay-proxy
    asserts:
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: relay-proxy
            app.kubernetes.io/instance: my-release

  - it: should use the same selector as the deployment pods
    release:
      name: my-release
    set:
      pdb.enable: true
      commonLabels:
        team: backend
    asserts:
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: relay-proxy
            app.kubernetes.io/instance: my-release
        template: pdb.yaml
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: relay-proxy
            app.kubernetes.io/instance: my-release
        template: deployment.yaml
      - isSubset:
          path: spec.template.metadata.labels
          content:
            app.kubernetes.io/name: relay-proxy
            app.kubernetes.io/instance: my-release
        template: deployment.yaml

  - it: should only set maxUnavailable when minAvailable is false/0
    template: pdb.yaml
    set:
      pdb.enable: true
      pdb.minAvailable: 0
      pdb.maxUnavailable: 2
    asserts:
      - isNull:
          path: spec.minAvailable
      - equal:
          path: spec.maxUnavailable
          value: 2