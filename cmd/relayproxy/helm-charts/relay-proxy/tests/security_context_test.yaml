suite: test security context
templates:
  - deployment.yaml
  - configmap.yaml
tests:
  - it: should keep empty security contexts by default
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value: {}
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value: {}

  - it: should run as non-root when nonRoot.enabled is true
    template: deployment.yaml
    set:
      nonRoot:
        enabled: true
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      - isNull:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem

  - it: should let user security contexts override nonRoot defaults
    template: deployment.yaml
    set:
      nonRoot:
        enabled: true
      podSecurityContext:
        runAsUser: 1000
      securityContext:
        readOnlyRootFilesystem: true
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1000
      - equal:
          path: spec.template.spec.securityContext.runAsGroup
          value: 65532
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value:
            - ALL

  - it: should keep explicit false, zero and empty user values over nonRoot defaults
    template: deployment.yaml
    set:
      nonRoot:
        enabled: true
      podSecurityContext:
        runAsNonRoot: false
        fsGroup: 0
      securityContext:
        allowPrivilegeEscalation: true
        capabilities:
          drop: []
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: false
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 0
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value: []

  - it: should replace nested nonRoot defaults as a whole
    template: deployment.yaml
    set:
      nonRoot:
        enabled: true
      podSecurityContext:
        seccompProfile:
          type: Localhost
          localhostProfile: profiles/relay-proxy.json
      securityContext:
        capabilities:
          add:
            - NET_BIND_SERVICE
    asserts:
      - equal:
          path: spec.template.spec.securityContext.seccompProfile
          value:
            type: Localhost
            localhostProfile: profiles/relay-proxy.json
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities
          value:
            add:
              - NET_BIND_SERVICE
