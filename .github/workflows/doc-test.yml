name: Docs validation
on:
  pull_request:
    branches:
      - main

jobs:
  test-doc-build:
    name: Test documentation build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 100
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
      - name: Get changed files in the docs folder
        id: changed-files-specific
        uses: marceloprado/has-changed-path@df1b7a3161b8fb9fd8c90403c66a9e66dfde50cb # v1.0.1
        with:
          paths: ./website/
      - name: Test Build website
        if: steps.changed-files-specific.outputs.changed == 'true'
        run: make build-doc
      # Runs after the build so it can reuse the node_modules it installed.
      # Every blog post needs a cover (the blog index is a card grid) and a
      # known category (it drives the filter chips).
      # `always()` so a broken build still reports the front matter problems
      # instead of hiding them behind the build failure.
      - name: Check blog front matter
        if: always() && steps.changed-files-specific.outputs.changed == 'true'
        run: npm run lint:blog --prefix website
