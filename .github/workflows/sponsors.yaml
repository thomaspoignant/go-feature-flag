name: Generate Sponsors README
on:
  workflow_dispatch:
  schedule:
    - cron: 30 15 * * 0-6

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sponsors
          persist-credentials: false

      - name: Generate Sponsors 💖
        uses: JamesIves/github-sponsors-readme-action@02650b8cd445fc16dfef73195f9c406dce041623 # v1.6.1
        with:
          token: ${{ secrets.SPONSORS_GITHUB_PAT }}
          file: "sponsors/README.md"
          fallback: "No sponsor at the moment! 😢"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: update-sponsor-list
          title: "docs(README): Update sponsor list"
          body: Automated pull request to update readme with the sponsor list
          commit-message: Update readme with the sponsor list
          labels: automerge
          assignees: thomaspoignant
          draft: false
          signoff: true
          delete-branch: true
          path: sponsors
          token: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
