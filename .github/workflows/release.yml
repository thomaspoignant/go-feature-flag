name: Release
on:
  push:
    tags:
      - "v*"

jobs:
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - name: Set up Maven
        uses: stCarolas/setup-maven@d6af6abeda15e98926a57b5aa970a96bb37f97d1 # v5
        with:
          maven-version: 3.8.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 23
          package-manager-cache: false
      - name: Install ICU packages
        run: sudo apt-get update && sudo apt-get install -y libicu-dev
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "7.0.x"
      - run: make vendor
      - run: make provider-tests

  goreleaser:
    needs: integration-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Free space on runner
        run: ./.github/ci-scripts/free_space.sh

      - name: Fetch all tags
        run: git fetch --force --tags

      - name: Setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Docker login
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "${DOCKER_PASSWORD}" | docker login --username "${DOCKER_USERNAME}" --password-stdin

      # The images are mirrored to ghcr.io/go-feature-flag/*, which lives under the
      # organisation while this repository lives under a personal account. The built-in
      # GITHUB_TOKEN is scoped to the repository owner and cannot write there, and GHCR
      # only accepts personal access tokens (classic), hence the dedicated GHCR_TOKEN.
      - name: GHCR login
        env:
          GHCR_USERNAME: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          echo "${GHCR_TOKEN}" | docker login ghcr.io --username "${GHCR_USERNAME}" --password-stdin

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_SIGNING_KEY }}
          passphrase: ${{ secrets.GPG_SIGNING_KEY_PASSWORD }}

      - name: Load FIPS module version
        run: echo "GOFIPS140=$(cat .fips-version | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --timeout 60m
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

  dockerhub-cli:
    runs-on: ubuntu-latest
    name: Upload dockerhub readme
    needs:
      - goreleaser
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release readme to DockerHub
        uses: ms-jpq/sync-dockerhub-readme@e2991ea1ba48832e73555cdbd5b82f5a2e91ee9b # v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: gofeatureflag/go-feature-flag-cli
          readme: "./cmd/cli/DOCKERHUB.md"

  dockerhub-relay-proxy:
    runs-on: ubuntu-latest
    name: Upload dockerhub readme
    needs:
      - goreleaser
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release readme to DockerHub
        uses: ms-jpq/sync-dockerhub-readme@e2991ea1ba48832e73555cdbd5b82f5a2e91ee9b # v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: thomaspoignant/go-feature-flag-relay-proxy
          readme: "./cmd/relayproxy/DOCKERHUB_deprecated.md"

  dockerhub-go-feature-flag-server:
    runs-on: ubuntu-latest
    name: Upload dockerhub readme
    needs:
      - goreleaser
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release readme to DockerHub
        uses: ms-jpq/sync-dockerhub-readme@e2991ea1ba48832e73555cdbd5b82f5a2e91ee9b # v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: thomaspoignant/go-feature-flag
          readme: "./cmd/relayproxy/DOCKERHUB_thomaspoignant.md"
      - name: Release readme to DockerHub gofeatureflag
        uses: ms-jpq/sync-dockerhub-readme@e2991ea1ba48832e73555cdbd5b82f5a2e91ee9b # v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: gofeatureflag/go-feature-flag
          readme: "./cmd/relayproxy/DOCKERHUB.md"

  doc-release:
    # doc release will create a new tag of the documentation en commit it in
    # the main branch. This new version of the doc will be release to gh-pages
    # when the GitHub Action called "Deploy to GitHub Pages" will be executed.
    runs-on: ubuntu-latest
    env:
      MAIN_BRANCH_NAME: main
      WEBSITE_DIR: website
    name: Create new documentation tag
    needs:
      - goreleaser
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: release
          token: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false

      - name: Install dependencies
        working-directory: ./release/${{ env.WEBSITE_DIR }}
        run: npm ci --ignore-scripts

      - name: Tagging a new version
        working-directory: ./release/${{ env.WEBSITE_DIR }}
        env:
          VERSION: ${{ env.VERSION }}
        run: npm run docusaurus docs:version "$VERSION"

      - name: Setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./release/${{ env.WEBSITE_DIR }}/.ci/go.mod
          check-latest: true
          cache: false

      - name: Clean up version.json
        working-directory: ./release/${{ env.WEBSITE_DIR }}/.ci
        run: go run versions.go

      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.MAIN_BRANCH_NAME }}
          path: ${{ env.MAIN_BRANCH_NAME }}
          token: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          persist-credentials: false

      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Copy version to main branch
        run: cp -rf release/${{ env.WEBSITE_DIR }}/ $MAIN_BRANCH_NAME

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        env:
          VERSION: ${{ env.VERSION }}
        with:
          base: main
          branch: create-new-doc-version-${{ env.VERSION }}
          title: "docs(docusaurus): Create a new documentation version ${{ env.VERSION }}"
          body: Automated pull request to create a new documentation version ${{ env.VERSION }}
          commit-message: Create a new documentation version ${{ env.VERSION }}
          labels: automerge
          assignees: thomaspoignant
          draft: false
          signoff: true
          delete-branch: true
          path: ${{ env.MAIN_BRANCH_NAME }}
          token: ${{ secrets.PERSONAL_GITHUB_TOKEN }}

  release-jsonschema:
    # release-jsonschema is opening a pull request to deploy a new jsonschema if needed
    runs-on: ubuntu-latest
    name: Release jsonschema
    needs:
      - goreleaser
    permissions:
      contents: read
      pull-requests: write
    env:
      SCHEMA_LOCATION: .schema/flag-schema.json
      MAIN_BRANCH_NAME: main
    steps:
      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: release
          token: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          persist-credentials: false

      - name: Setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./release/go.mod
          check-latest: true
          cache: false

      - name: Build jsonschema-generator
        working-directory: ./release/
        run: make vendor && make build-jsonschema-generator

      - name: Create jsonschema
        working-directory: ./release/
        run: ./out/bin/jsonschema-generator --schema-location=./.schema/flag-schema.json

      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.MAIN_BRANCH_NAME }}
          path: ${{ env.MAIN_BRANCH_NAME }}
          token: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          persist-credentials: false

      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Copy version to main branch
        run: cp -rf release/$SCHEMA_LOCATION $MAIN_BRANCH_NAME/$SCHEMA_LOCATION

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        env:
          VERSION: ${{ env.VERSION }}
        with:
          base: main
          branch: release-jsonschema-${{ env.VERSION }}
          title: "feat(jsonschema): Release a new version of the jsonschema ${{ env.VERSION }}"
          body: Automated pull request to release a new version of the jsonschema ${{ env.VERSION }}
          commit-message: Release a new version of the jsonschema ${{ env.VERSION }}
          labels: automerge
          assignees: thomaspoignant
          draft: false
          signoff: true
          delete-branch: true
          path: ${{ env.MAIN_BRANCH_NAME }}
          token: ${{ secrets.PERSONAL_GITHUB_TOKEN }}

  release-helm-chart:
    runs-on: ubuntu-latest
    name: Release Relay Proxy Helm chart
    needs:
      - goreleaser
    permissions:
      contents: read
    env:
      CHART_DIR: ./cmd/relayproxy/helm-charts/relay-proxy
      HAS_GHCR_TOKEN: ${{ secrets.GHCR_TOKEN != '' }}
    steps:
      - name: Extract version from tag
        run: |
          app_version="${GITHUB_REF#refs/tags/}"
          echo "APP_VERSION=${app_version}" >> "$GITHUB_ENV"
          echo "CHART_VERSION=${app_version#v}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0

      # Both publish steps below take the version from the tag, never from Chart.yaml, so the
      # published artifact can never disagree with the release. This check is only there to
      # fail loudly if release-please stopped bumping the file, since users reading the
      # repository would then see a version that does not match what was published.
      - name: Check Chart.yaml matches the released version
        run: |
          chart_version=$(helm show chart "$CHART_DIR" | awk '/^version:/ {print $2}')
          if [ "$chart_version" != "$CHART_VERSION" ]; then
            echo "Chart.yaml says ${chart_version}, tag says ${CHART_VERSION}."
            echo "release-please should have bumped it through the extra-files entry in"
            echo ".github/release-please/release-please-config.json; check the"
            echo "x-release-please-version annotations in Chart.yaml."
            exit 1
          fi

      - name: Publish Helm chart to charts.gofeatureflag.org
        uses: stefanprodan/helm-gh-pages@0ad2bb377311d61ac04ad9eb6f252fb68e207260 # v1.7.0
        with:
          token: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          charts_dir: ./cmd/relayproxy/helm-charts/
          chart_version: ${{ env.CHART_VERSION }}
          app_version: ${{ env.APP_VERSION }}
          charts_url: https://charts.gofeatureflag.org
          owner: go-feature-flag
          repository: helm-charts
          branch: gh-pages
          target_dir: ./
          commit_username: thomaspoignant
          commit_email: thomaspoignant@goferatureflag.org

      - name: GHCR login
        if: env.HAS_GHCR_TOKEN == 'true'
        env:
          GHCR_USERNAME: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          echo "${GHCR_TOKEN}" | helm registry login ghcr.io --username "${GHCR_USERNAME}" --password-stdin

      - name: Push Helm chart to GHCR
        if: env.HAS_GHCR_TOKEN == 'true'
        env:
          OCI_REPO: oci://ghcr.io/go-feature-flag/charts
        run: |
          helm package "$CHART_DIR" \
            --version "$CHART_VERSION" \
            --app-version "$APP_VERSION" \
            --destination /tmp/charts
          helm push "/tmp/charts/relay-proxy-${CHART_VERSION}.tgz" "$OCI_REPO"
