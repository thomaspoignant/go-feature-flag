name: Release Charts
on:
  push:
    branches:
      - main

jobs:
  helm-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CHART_README_LOCATION: cmd/relayproxy/helm-charts/relay-proxy/README.md
      MAIN_BRANCH_NAME: main
      # The `secrets` context is not available in a step-level `if`, so surface only
      # whether the token is configured, never its value.
      HAS_GHCR_TOKEN: ${{ secrets.GHCR_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Get changed files in the docs folder
        id: changed-files-specific
        uses: marceloprado/has-changed-path@df1b7a3161b8fb9fd8c90403c66a9e66dfde50cb # v1.0.1
        with:
          paths: ./cmd/relayproxy/helm-charts/

      - name: Publish Helm chart
        if: steps.changed-files-specific.outputs.changed == 'true'
        uses: stefanprodan/helm-gh-pages@0ad2bb377311d61ac04ad9eb6f252fb68e207260 # v1.7.0
        with:
          token: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          charts_dir: ./cmd/relayproxy/helm-charts/
          charts_url: https://charts.gofeatureflag.org
          owner: go-feature-flag
          repository: helm-charts
          branch: gh-pages
          target_dir: ./
          commit_username: thomaspoignant
          commit_email: thomaspoignant@goferatureflag.org

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      - name: Update chart README
        if: steps.changed-files-specific.outputs.changed == 'true'
        run: make generate-helm-docs

      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.MAIN_BRANCH_NAME }}
          path: ${{ env.MAIN_BRANCH_NAME }}
          token: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Copy README to main branch
        run: cp -rf $CHART_README_LOCATION $MAIN_BRANCH_NAME/$CHART_README_LOCATION

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: steps.changed-files-specific.outputs.changed == 'true'
        with:
          branch: update-relay-proxy-chart-readme
          title: "docs(helm): Update relay proxy helm README"
          body: Automated pull request to update relay-proxy helm chart README
          commit-message: Update relay proxy helm README
          labels: automerge
          assignees: thomaspoignant
          draft: false
          signoff: true
          delete-branch: true
          path: ${{ env.MAIN_BRANCH_NAME }}
          token: ${{ secrets.PERSONAL_GITHUB_TOKEN }}

      # Publish the chart as an OCI artifact too, for users who cannot reach
      # charts.gofeatureflag.org or who prefer pulling everything from a registry.
      # These steps come last, and are skipped when GHCR_TOKEN is not configured, so a
      # registry problem can never strand the gh-pages publish or the README pull request.
      - name: GHCR login
        if: steps.changed-files-specific.outputs.changed == 'true' && env.HAS_GHCR_TOKEN == 'true'
        env:
          GHCR_USERNAME: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          echo "${GHCR_TOKEN}" | helm registry login ghcr.io --username "${GHCR_USERNAME}" --password-stdin

      # The chart version is only bumped at release time, but this workflow runs on every
      # push to main touching the chart. Re-pushing would overwrite an already published
      # tag with a different digest (helm package embeds file mtimes), so publish once.
      - name: Push Helm chart to GHCR
        if: steps.changed-files-specific.outputs.changed == 'true' && env.HAS_GHCR_TOKEN == 'true'
        env:
          CHART_DIR: ./cmd/relayproxy/helm-charts/relay-proxy
          OCI_REPO: oci://ghcr.io/go-feature-flag/charts
        run: |
          version=$(helm show chart "$CHART_DIR" | awk '/^version:/ {print $2}')
          if helm show chart "$OCI_REPO/relay-proxy" --version "$version" >/dev/null 2>&1; then
            echo "relay-proxy $version is already published on GHCR, nothing to push."
            exit 0
          fi
          helm package "$CHART_DIR" --destination /tmp/charts
          helm push "/tmp/charts/relay-proxy-$version.tgz" "$OCI_REPO"
