name: Helm Lint and Test Charts
on: pull_request

permissions: {}

jobs:
  lint-helm-chart:
    name: Lint Helm Chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 100
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.11.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: Get changed files in the docs folder
        id: changed-files-specific
        uses: marceloprado/has-changed-path@df1b7a3161b8fb9fd8c90403c66a9e66dfde50cb # v1.0.1
        with:
          paths: ./cmd/relayproxy/helm-charts/

      - name: Run chart-testing (lint)
        working-directory: ./cmd/relayproxy/helm-charts/relay-proxy/
        run: ct lint --chart-dirs . --charts .

      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa #v1.15.1
        if: steps.changed-files-specific.outputs.changed == 'true'

      - name: Run chart-testing (install)
        working-directory: ./cmd/relayproxy/helm-charts/relay-proxy/
        run: ct install --chart-dirs . --charts . --helm-extra-set-args "--set=image.tag=latest"
        if: steps.changed-files-specific.outputs.changed == 'true'
