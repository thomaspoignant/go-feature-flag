# Flags used by feature_flag_bench_test.go (one flag per type and scenario).
# Rollout dates are fixed far in the past/future so the progressive rollout is always
# in progress and the scheduled rollout always has one applied and one pending step.

bool-no-rule-100:
  variations:
    A: true
    B: false
  defaultRule:
    percentage:
      A: 100
      B: 0

bool-no-rule-0:
  variations:
    A: true
    B: false
  defaultRule:
    percentage:
      A: 0
      B: 100

bool-no-rule-50:
  variations:
    A: true
    B: false
  defaultRule:
    percentage:
      A: 50
      B: 50

bool-rule:
  variations:
    A: true
    B: false
  targeting:
    - query: key eq "user-5"
      variation: A
  defaultRule:
    variation: B

bool-rule-complex:
  variations:
    A: true
    B: false
  targeting:
    - query: key eq "user-5" or key eq "user-36" or key eq "user-1500"
      variation: A
  defaultRule:
    variation: B

bool-rollout-progressive:
  variations:
    A: true
    B: false
  defaultRule:
    progressiveRollout:
      initial:
        variation: B
        percentage: 0
        date: 2000-01-01T00:00:00Z
      end:
        variation: A
        percentage: 100
        date: 2050-01-01T00:00:00Z

bool-rollout-scheduled:
  variations:
    A: true
    B: false
  defaultRule:
    percentage:
      A: 0
      B: 100
  scheduledRollout:
    - date: 2000-01-01T00:00:00Z
      defaultRule:
        percentage:
          A: 50
          B: 50
    - date: 2100-01-01T00:00:00Z
      defaultRule:
        percentage:
          A: 100
          B: 0

